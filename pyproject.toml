[build-system]
requires = [
  "setuptools==75.3.2; python_version < '3.10'",
  "setuptools==84.0.0; python_version >= '3.10'",
  "wheel==0.45.1; python_version < '3.9'",
  "wheel==0.48.0; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "configreach"
version = "0.9.3"
description = "Deterministic configuration coverage for software repositories"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{name = "Saurav Singla"}]
keywords = [
  "configuration testing",
  "config coverage",
  "configuration coverage",
  "environment variable test coverage",
  "environment variable testing",
  "feature flag test coverage",
  "test environment variables",
  "kubernetes configuration testing",
  "kubernetes",
  "static analysis",
  "github actions",
  "testing",
  "ci",
  "devtools",
  "feature flags",
  "environment variables",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "tomli==2.2.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sauravsingla/ConfigReach"
Documentation = "https://sauravsingla.github.io/ConfigReach/"
Repository = "https://github.com/sauravsingla/ConfigReach"
Issues = "https://github.com/sauravsingla/ConfigReach/issues"
Changelog = "https://github.com/sauravsingla/ConfigReach/blob/main/CHANGELOG.md"
Archive = "https://zenodo.org/records/23038726"
"Hugging Face Collection" = "https://huggingface.co/collections/sauravsingla08/configreach-configuration-coverage"

[project.optional-dependencies]
dev = [
  "pytest==8.3.5; python_version == '3.8'",
  "pytest==8.4.2; python_version == '3.9'",
  "pytest==9.1.1; python_version >= '3.10'",
  "pytest-cov==5.0.0; python_version == '3.8'",
  "pytest-cov==7.1.0; python_version >= '3.9'",
  "build==1.2.2.post1; python_version < '3.10'",
  "build==1.6.1; python_version >= '3.10'",
  "wheel==0.45.1; python_version < '3.9'",
  "wheel==0.48.0; python_version >= '3.9'",
  "setuptools==75.3.2; python_version < '3.10'",
  "setuptools==84.0.0; python_version >= '3.10'",
]

[project.scripts]
configreach = "configreach.entrypoint:main"

[project.entry-points."configreach.adapters"]
# Third-party packages register adapters in this group. The core intentionally
# ships without optional external parser dependencies.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
