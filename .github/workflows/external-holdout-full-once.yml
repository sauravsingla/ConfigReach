name: External holdout full one-off

on:
  push:
    branches:
      - validation/full-holdout-results-20260929

permissions:
  contents: read

jobs:
  full-holdout:
    name: ${{ matrix.ecosystem }} — ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: apache/airflow
            slug: apache-airflow
            ecosystem: Python-Airflow
          - repo: PrefectHQ/prefect
            slug: prefecthq-prefect
            ecosystem: Python-Prefect
          - repo: vercel/next.js
            slug: vercel-nextjs
            ecosystem: JavaScript-TypeScript-NextJS
          - repo: vitejs/vite
            slug: vitejs-vite
            ecosystem: JavaScript-TypeScript-Vite
          - repo: argoproj/argo-cd
            slug: argoproj-argo-cd
            ecosystem: Go-Kubernetes
          - repo: spring-projects/spring-boot
            slug: spring-projects-spring-boot
            ecosystem: Java-Spring
          - repo: dotnet/aspnetcore
            slug: dotnet-aspnetcore
            ecosystem: DotNET-CSharp
          - repo: astral-sh/uv
            slug: astral-sh-uv
            ecosystem: Rust
          - repo: rails/rails
            slug: rails-rails
            ecosystem: Ruby
          - repo: laravel/framework
            slug: laravel-framework
            ecosystem: PHP
          - repo: terraform-aws-modules/terraform-aws-vpc
            slug: terraform-aws-vpc
            ecosystem: Terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConfigReach
        run: python -m pip install -e .
      - name: Scan frozen repository
        run: |
          python validation/run_external_holdout.py \
            --manifest validation/external_holdout_projects.json \
            --baseline-manifest validation/real_world_projects.json \
            --reviews validation/external_holdout_reviews.json \
            --profile full \
            --repo "${{ matrix.repo }}" \
            --json "validation/results/${{ matrix.slug }}.json" \
            --markdown "validation/results/${{ matrix.slug }}.md"
      - name: Add repository summary
        if: always()
        run: |
          if [[ -f "validation/results/${{ matrix.slug }}.md" ]]; then
            cat "validation/results/${{ matrix.slug }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: configreach-holdout-${{ matrix.slug }}
          path: |
            validation/results/${{ matrix.slug }}.json
            validation/results/${{ matrix.slug }}.md
          if-no-files-found: warn
