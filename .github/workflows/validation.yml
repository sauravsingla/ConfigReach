name: Validation evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/configreach/**"
      - ".github/workflows/validation.yml"
      - "tools/verify_validation_evidence.py"
      - "validation/run_real_world.py"
      - "validation/real_world_projects.json"
      - "validation/real_world_reviews.json"
      - "validation/accuracy/**"
      - "validation/results/accuracy.json"
      - "validation/results/accuracy.md"
      - "validation/results/real-world.json"
      - "validation/results/real-world.md"
  push:
    branches: [main]
    paths:
      - "src/configreach/**"
      - ".github/workflows/validation.yml"
      - "tools/verify_validation_evidence.py"
      - "validation/run_real_world.py"
      - "validation/real_world_projects.json"
      - "validation/real_world_reviews.json"
      - "validation/accuracy/**"
      - "validation/results/accuracy.json"
      - "validation/results/accuracy.md"
      - "validation/results/real-world.json"
      - "validation/results/real-world.md"

permissions:
  contents: read

concurrency:
  group: configreach-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accuracy:
    name: measured accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install ConfigReach from source
        run: python -m pip install -e .
      - name: Score hand-labelled accuracy corpus
        run: |
          python validation/accuracy/run_accuracy.py \
            --corpus validation/accuracy/corpus.json \
            --json validation/results/accuracy.json \
            --markdown validation/results/accuracy.md
          cat validation/results/accuracy.md
      - name: Verify committed accuracy evidence is semantically reproducible
        run: python tools/verify_validation_evidence.py accuracy
      - name: Upload measured accuracy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configreach-measured-accuracy
          path: |
            validation/results/accuracy.json
            validation/results/accuracy.md
          if-no-files-found: error

  validation:
    name: real-world validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install ConfigReach from source
        run: python -m pip install -e .

      - name: Score hand-labelled accuracy corpus
        run: |
          python validation/accuracy/run_accuracy.py \
            --corpus validation/accuracy/corpus.json \
            --json validation/results/accuracy.json \
            --markdown validation/results/accuracy.md

      - name: Scan pinned real-world repositories
        run: |
          python validation/run_real_world.py \
            --manifest validation/real_world_projects.json \
            --reviews validation/real_world_reviews.json \
            --json validation/results/real-world.json \
            --markdown validation/results/real-world.md

      - name: Add validation summary
        run: |
          cat validation/results/accuracy.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat validation/results/real-world.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify committed validation evidence is semantically reproducible
        run: python tools/verify_validation_evidence.py all

      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configreach-validation-evidence
          path: validation/results/
          if-no-files-found: error
