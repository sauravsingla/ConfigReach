name: Curated 50K validation

on:
  pull_request:
    branches: [main]
    paths:
      - src/configreach/**
      - tests/test_lexical_hardening.py
      - tests/test_precision_hardening.py
      - validation/curated_50k/**
      - validation/results/curated_50k.json
      - validation/results/curated_50k.md
      - validation/results/curated_50k_predictions.csv
      - .github/workflows/curated-50k-validation.yml
  push:
    branches: [main]
    paths:
      - src/configreach/**
      - tests/test_lexical_hardening.py
      - tests/test_precision_hardening.py
      - validation/curated_50k/**
      - validation/results/curated_50k.json
      - validation/results/curated_50k.md
      - validation/results/curated_50k_predictions.csv
      - .github/workflows/curated-50k-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install ConfigReach
        run: python -m pip install -e '.[dev]'
      - name: Materialize curated 50K corpus
        run: python validation/curated_50k/generate_dataset.py
      - name: Run hardening regressions
        run: pytest -q tests/test_lexical_hardening.py tests/test_precision_hardening.py
      - name: Run production-engine benchmark
        run: python validation/curated_50k/run_benchmark.py
      - name: Verify measured benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('validation/results/curated_50k.json').read_text())
          overall = result['overall']
          assert result['scenario_count'] == 50000
          assert overall['tp'] + overall['fn'] == 25000
          assert overall['tn'] + overall['fp'] == 25000
          print(json.dumps(overall, indent=2, sort_keys=True))
          PY
      - name: Verify committed 50K evidence is reproducible
        run: |
          git diff --exit-code -- \
            validation/curated_50k/manifest.json \
            validation/curated_50k/data/configreach_50k_scenarios.jsonl \
            validation/results/curated_50k.json \
            validation/results/curated_50k.md \
            validation/results/curated_50k_predictions.csv
