name: Curated 50K validation

on:
  push:
    branches: [benchmark/curated-50k-lexical-hardening]
    paths:
      - src/configreach/**
      - tests/test_lexical_hardening.py
      - tests/test_precision_hardening.py
      - validation/curated_50k/**
      - .github/workflows/curated-50k-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install ConfigReach
        run: python -m pip install -e '.[dev]'
      - name: Generate curated 50K corpus
        run: python validation/curated_50k/generate_dataset.py
      - name: Run production-engine benchmark
        run: python validation/curated_50k/run_benchmark.py
      - name: Run hardening regressions
        run: pytest -q tests/test_lexical_hardening.py tests/test_precision_hardening.py
      - name: Commit reproducible corpus and measured result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/curated_50k/data/configreach_50k_scenarios.jsonl \
                  validation/curated_50k/manifest.json \
                  validation/curated_50k/results/configreach_50k_runtime.json
          if git diff --cached --quiet; then
            echo 'Curated 50K evidence already current'
            exit 0
          fi
          git commit -m 'validation: materialize curated 50k evidence [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
