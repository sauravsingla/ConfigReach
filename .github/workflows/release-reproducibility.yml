name: Release Reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist twice
        run: python tools/release_repro.py --output release-repro.json --artifacts-dir dist
      - name: Inspect release manifest
        run: configreach release dist --format json --output release-manifest.json
      - name: Verify wheel can be installed independently
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          configreach scan examples/basic --format json --no-cache > /tmp/release-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configreach-release-artifacts
          path: |
            dist/*
            release-repro.json
            release-manifest.json
