name: Performance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run polyglot performance budget
        run: python benchmarks/perf_budget.py --files 800 --min-files-per-second 150 --output perf-budget.json
      - name: Create performance history record
        run: python benchmarks/perf_history.py perf-budget.json --output performance-history.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configreach-performance-history-${{ github.run_number }}
          retention-days: 90
          path: |
            perf-budget.json
            performance-history.json
