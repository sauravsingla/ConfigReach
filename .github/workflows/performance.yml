name: Performance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run polyglot performance budget
        run: python benchmarks/perf_budget.py --files 800 --min-files-per-second 150 --output perf-budget.json
      - name: Create performance history record
        run: python benchmarks/perf_history.py perf-budget.json --output performance-history.json
      - uses: actions/upload-artifact@v4
        with:
          name: configreach-performance-history-${{ github.run_number }}
          retention-days: 90
          path: |
            perf-budget.json
            performance-history.json
