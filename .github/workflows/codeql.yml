name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  security-events: write
  packages: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
