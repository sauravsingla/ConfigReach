name: Sync v0.9.3 metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-v0-9-3-metadata.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize v0.9.3 metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences of {old!r}, found {actual}")
              if actual == 0:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              p.write_text(text.replace(old, new))

          replace("pyproject.toml", 'version = "0.9.2"', 'version = "0.9.3"', 1)
          replace("src/configreach/__init__.py", '__version__ = "0.9.2"', '__version__ = "0.9.3"', 1)
          replace("CITATION.cff", 'version: "0.9.2"', 'version: "0.9.3"', 1)
          replace("CITATION.cff", 'date-released: "2026-09-29"', 'date-released: "2026-09-30"', 1)
          replace("huggingface-space/README.md", '**ConfigReach v0.9.2** is the current repository version.', '**ConfigReach v0.9.3** is the current repository version.', 1)
          replace("docs/index.html", 'v0.9.2 · MIT · CPU-only · zero runtime dependencies', 'v0.9.3 · MIT · CPU-only · zero runtime dependencies', 1)
          replace("docs/index.html", 'ConfigReach v0.9.2 source supports Python 3.11+', 'ConfigReach v0.9.3 source supports Python 3.11+', 1)
          replace("docs/marketplace.md", 'v0.9.2', 'v0.9.3', 2)
          replace(
              "docs/marketplace.md",
              'The remaining Marketplace publication step is performed from the GitHub release/Marketplace interface. No additional runtime code change is required for the listing itself.',
              'ConfigReach v0.9.3 is published on GitHub Marketplace. The repository metadata, release line and installation documentation are synchronized with the live listing.',
              1,
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n\n"
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG.md: Unreleased marker not found exactly once")
          section = (
              "## [0.9.3] - 2026-09-30\n\n"
              "### Added\n"
              "- Published ConfigReach Configuration Coverage to GitHub Marketplace.\n"
              "- Added Zenodo archive/citation metadata and reusable distribution launch materials.\n\n"
              "### Changed\n"
              "- Synchronized package, runtime, citation, documentation and Hugging Face source-version metadata with the v0.9.3 release.\n\n"
          )
          text = text.replace(marker, marker + section)
          text = text.replace(
              "[Unreleased]: https://github.com/sauravsingla/ConfigReach/compare/v0.9.2...HEAD",
              "[Unreleased]: https://github.com/sauravsingla/ConfigReach/compare/v0.9.3...HEAD\n[0.9.3]: https://github.com/sauravsingla/ConfigReach/compare/v0.9.2...v0.9.3",
          )
          changelog.write_text(text)
          PY

      - name: Commit synchronized metadata and remove one-time workflow
        run: |
          rm .github/workflows/sync-v0-9-3-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/configreach/__init__.py CITATION.cff CHANGELOG.md huggingface-space/README.md docs/index.html docs/marketplace.md .github/workflows/sync-v0-9-3-metadata.yml
          git commit -m "release: synchronize ConfigReach v0.9.3 metadata"
          git push origin HEAD:main

          release_sha=$(git rev-parse HEAD)
          git tag -f v0.9.3 "$release_sha"
          git tag -f v0 "$release_sha"
          git push origin refs/tags/v0.9.3 --force
          git push origin refs/tags/v0 --force
