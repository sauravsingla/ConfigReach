name: Refresh validation reviews

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "validation/apply_reviews.py"
      - "validation/run_real_world.py"
      - "validation/real_world_reviews.json"
      - "validation/results/real-world.json"
      - "validation/results/real-world.md"
      - ".github/workflows/validation-review-refresh.yml"
  push:
    branches: [main]
    paths:
      - "validation/apply_reviews.py"
      - "validation/run_real_world.py"
      - "validation/real_world_reviews.json"
      - "validation/results/real-world.json"
      - "validation/results/real-world.md"
      - ".github/workflows/validation-review-refresh.yml"

permissions:
  contents: read

concurrency:
  group: configreach-validation-review-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install ConfigReach from source
        run: python -m pip install -e .

      - name: Apply manual reviews to published scan evidence
        run: python validation/apply_reviews.py

      - name: Verify reviewed evidence matches committed annotations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('validation/results/real-world.json').read_text())
          review_doc = json.loads(Path('validation/real_world_reviews.json').read_text())
          reviews = review_doc.get('reviews', [])
          expected_projects = sum(1 for item in reviews if item.get('scope', 'not-yet-reviewed') != 'not-yet-reviewed')
          expected_fp = sum(len(item.get('false_positives', [])) for item in reviews)
          expected_fn = sum(len(item.get('false_negatives', [])) for item in reviews)
          summary = data['summary']
          assert summary['projects_with_manual_review'] == expected_projects, (summary, expected_projects)
          assert summary['reviewed_false_positives'] == expected_fp, (summary, expected_fp)
          assert summary['reviewed_false_negatives'] == expected_fn, (summary, expected_fn)
          print({
              'projects_with_manual_review': expected_projects,
              'reviewed_false_positives': expected_fp,
              'reviewed_false_negatives': expected_fn,
          })
          PY

      - name: Verify committed reviewed evidence is reproducible
        run: git diff --exit-code -- validation/results/real-world.json validation/results/real-world.md
