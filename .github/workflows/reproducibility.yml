name: Reproducibility
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: configreach reproduce examples/combinations --runs 3 --format json --output repro.json
      - run: configreach adapters --format json --output adapters.json
      - run: python -c "import json,os; d=json.load(open('repro.json', encoding='utf-8')); open('digest-'+os.environ['RUNNER_OS']+'.txt','w', encoding='utf-8').write(d['runs'][0]['sha256'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ runner.os }}
          path: digest-${{ runner.os }}.txt

  compare:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - run: python -c "from pathlib import Path; files=sorted(Path('digests').glob('digest-*.txt')); values={p.read_text().strip() for p in files}; print({p.name:p.read_text().strip() for p in files}); assert len(files)==3 and len(values)==1, 'cross-OS digests differ'"
