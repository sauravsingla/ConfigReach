name: Publish ConfigReach to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - huggingface-space/**
      - pyproject.toml
      - validation/curated_50k/manifest.json
      - validation/results/curated_50k.json
      - validation/results/curated_50k.md
      - validation/results/curated_50k_predictions.csv
      - .github/workflows/publish-huggingface.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: huggingface-space
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify Space metrics match committed curated 50K evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          manifest = json.loads((root / 'validation/curated_50k/manifest.json').read_text(encoding='utf-8'))
          result = json.loads((root / 'validation/results/curated_50k.json').read_text(encoding='utf-8'))
          project = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))

          overall = result['overall']
          assert manifest['scenario_count'] == result['scenario_count'] == 50000
          assert manifest['expected_positive'] == 25000
          assert manifest['expected_negative'] == 25000
          assert manifest['unique_scenario_ids'] == 50000
          assert manifest['unique_expected_keys'] == 50000
          assert overall['tp'] == 25000 and overall['fp'] == 0
          assert overall['tn'] == 25000 and overall['fn'] == 0
          assert overall['precision'] == 1.0 and overall['recall'] == 1.0
          assert overall['f1'] == 1.0 and overall['accuracy'] == 1.0
          assert result['scanner']['entry_point'] == 'configreach.engine.scan'

          source_version = project['project']['version']
          required = {
              '50,000', '25,000', '100.0000%', 'configreach.engine.scan',
              'controlled curated benchmark', f'v{source_version}'
          }
          for rel in ('huggingface-space/README.md', 'huggingface-space/index.html'):
              text = (root / rel).read_text(encoding='utf-8')
              missing = sorted(value for value in required if value not in text)
              if missing:
                  raise SystemExit(f'{rel} is stale: missing ' + ', '.join(missing))
              stale = ('96,845', '5.72%', '37 true positives', 'Frozen external holdout')
              present_stale = [value for value in stale if value in text]
              if present_stale:
                  raise SystemExit(f'{rel} still contains old public metrics: ' + ', '.join(present_stale))

          print('Hugging Face Space is synchronized with the committed curated 50K benchmark')
          PY

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare static Space
        run: |
          rm -rf .hf-space
          mkdir -p .hf-space
          cp huggingface-space/README.md .hf-space/README.md
          cp huggingface-space/index.html .hf-space/index.html

      - name: Publish Space with OIDC
        env:
          HF_OIDC_RESOURCE: spaces/sauravsingla08/ConfigReach
        run: |
          hf upload sauravsingla08/ConfigReach .hf-space . \
            --repo-type space \
            --delete="*" \
            --commit-message="Sync ConfigReach curated 50K benchmark from GitHub ${GITHUB_SHA::7}"
