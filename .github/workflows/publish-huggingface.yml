name: Publish ConfigReach to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - huggingface-space/**
      - README.md
      - VALIDATION.md
      - pyproject.toml
      - validation/external_holdout_projects.json
      - validation/results/external-holdout-full.json
      - validation/results/external-holdout-full.md
      - validation/results/accuracy.json
      - validation/results/accuracy.md
      - validation/confrca/**
      - tests/test_confrca_benchmark.py
      - .github/workflows/confrca-benchmark.yml
      - .github/workflows/publish-huggingface.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: huggingface-space
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Space metrics match committed evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          holdout = json.loads((root / 'validation/results/external-holdout-full.json').read_text(encoding='utf-8'))
          accuracy = json.loads((root / 'validation/results/accuracy.json').read_text(encoding='utf-8'))
          project = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))

          projects = holdout['projects']
          summary = holdout['summary']
          selection = holdout['selection']
          execution = holdout['execution']
          ecosystems = holdout['ecosystem_summary']
          source_version = project['project']['version']
          validation_version = holdout['tool']['version']

          total_inputs = sum(item['configuration_inputs'] for item in projects)
          covered_inputs = sum(item['covered_inputs'] for item in projects)
          coverage_pct = covered_inputs / total_inputs * 100 if total_inputs else 100.0

          if summary['configuration_inputs'] != total_inputs:
              raise SystemExit('holdout summary configuration_inputs does not match project rows')
          if summary['covered_inputs'] != covered_inputs:
              raise SystemExit('holdout summary covered_inputs does not match project rows')
          if summary['projects_scanned'] != len(projects) or summary['projects_requested'] != len(projects):
              raise SystemExit('holdout project counts are inconsistent')
          if selection['baseline_overlap_count'] != 0:
              raise SystemExit('external holdout overlaps the historical baseline')
          if not execution['all_jobs_succeeded']:
              raise SystemExit('external holdout contains a failed repository job')
          if not validation_version:
              raise SystemExit('external holdout tool version is missing')
          if accuracy['tool']['version'] != validation_version:
              raise SystemExit('accuracy tool version does not match external holdout tool version')

          aggregate = accuracy['aggregate']
          if aggregate['true_positives'] <= 0:
              raise SystemExit('accuracy corpus has no true-positive labels')

          expected = {
              'source_version': f'v{source_version}',
              'inputs': f'{total_inputs:,}',
              'covered': f'{covered_inputs:,}',
              'coverage': f'{coverage_pct:.2f}%',
              'project_jobs': f"{len(projects)} / {len(projects)}",
              'ecosystems': f'{len(ecosystems)} ecosystems',
              'runtime': f"{summary['runtime_seconds']:,.1f}s",
              'precision': f"{aggregate['micro_precision'] * 100:.1f}%",
              'recall': f"{aggregate['micro_recall'] * 100:.1f}%",
              'f1': f"{aggregate['micro_f1'] * 100:.1f}%",
              'tp': str(aggregate['true_positives']),
          }

          for rel in ('huggingface-space/README.md', 'docs/index.html'):
              text = (root / rel).read_text(encoding='utf-8')
              missing = [f'{name}={value}' for name, value in expected.items() if value not in text]
              if missing:
                  raise SystemExit(f'{rel} is stale: missing ' + ', '.join(missing))

          space_readme = (root / 'huggingface-space/README.md').read_text(encoding='utf-8')
          validation_marker = f'ConfigReach v{validation_version}'
          if validation_marker not in space_readme:
              raise SystemExit(
                  'huggingface-space/README.md must identify the frozen validation scanner version: '
                  + validation_marker
              )

          print('Hugging Face public metrics are synchronized with committed evidence:')
          print(json.dumps({
              **expected,
              'validation_version': f'v{validation_version}',
          }, sort_keys=True))
          PY

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare static Space
        run: |
          rm -rf .hf-space
          mkdir -p .hf-space
          cp huggingface-space/README.md .hf-space/README.md
          cp docs/index.html .hf-space/index.html

      - name: Publish Space with OIDC
        env:
          HF_OIDC_RESOURCE: spaces/sauravsingla08/ConfigReach
        run: |
          hf upload sauravsingla08/ConfigReach .hf-space . \
            --repo-type space \
            --delete="*" \
            --commit-message="Sync ConfigReach from GitHub ${GITHUB_SHA::7}"

  confrca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark and Hugging Face dependencies
        run: |
          python -m pip install -e ".[dev]" pyarrow huggingface_hub hf_xet
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Mint short-lived Hugging Face token with trusted publisher
        env:
          HF_OIDC_RESOURCE: spaces/sauravsingla08/ConfigReach
        shell: bash
        run: |
          set -euo pipefail
          token="$(hf auth token)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Refresh frozen ConfRCA snapshot
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python validation/confrca/refresh_public_snapshot.py

      - name: Run ConfRCA external benchmark
        run: python validation/confrca/run_confrca_benchmark.py

      - name: Run focused benchmark tests
        run: pytest -q tests/test_confrca_benchmark.py

      - name: Show benchmark summary
        run: cat validation/results/confrca.md

      - name: Commit frozen snapshot and benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/confrca/data validation/results/confrca.json validation/results/confrca.md
          if git diff --cached --quiet; then
            echo "ConfRCA evidence already current"
            exit 0
          fi
          git commit -m "validation: add ConfRCA external benchmark evidence [skip ci]"
          git push origin HEAD:main

      - name: Upload ConfRCA evidence
        uses: actions/upload-artifact@v4
        with:
          name: confrca-external-benchmark
          path: |
            validation/confrca/data/
            validation/results/confrca.json
            validation/results/confrca.md
          if-no-files-found: error
          retention-days: 30
