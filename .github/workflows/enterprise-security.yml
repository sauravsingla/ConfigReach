name: Enterprise security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-regressions:
    name: policy and security regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ConfigReach
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Enforce immutable GitHub Action pins
        run: python tools/check_workflow_pins.py

      - name: Run security boundary regressions
        run: pytest -q tests/test_enterprise_security.py tests/test_python_compat_security.py

  secret-scan:
    name: repository secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hardened-container:
    name: non-root offline container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build local image
        run: docker build -t configreach:enterprise .

      - name: Require non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id configreach:enterprise -u)"
          test "$uid" != "0"
          echo "Container runtime UID: $uid"

      - name: Prove scanning works without network or writable root filesystem
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            -v "$PWD/examples/basic:/workspace:ro" \
            configreach:enterprise scan . --no-cache --format json \
            > /tmp/configreach-offline.json
          python -m json.tool /tmp/configreach-offline.json >/dev/null
