name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests tools benchmarks
      - run: python -m py_compile examples/plugins/tree_sitter_js/configreach_tree_sitter_js.py examples/plugins/tree_sitter_go/configreach_tree_sitter_go.py examples/plugins/feature_flags_provider/configreach_feature_flags.py
      - run: pytest
      - run: configreach scan examples/basic --format json --output /tmp/configreach-report.json --no-cache
      - run: configreach scan examples/polyglot --format sarif --output /tmp/configreach.sarif --no-cache
      - run: configreach scan examples/polyglot --format html --output /tmp/configreach.html --no-cache
      - run: configreach scan examples/frameworks --format json --output /tmp/configreach-frameworks.json --no-cache
      - run: configreach plan examples/combinations --format json --output /tmp/configreach-plan.json --no-cache
      - run: configreach plan examples/combinations --fixture pytest --output /tmp/configreach-fixtures.py --no-cache
      - run: configreach plan examples/combinations --fixture junit --output /tmp/ConfigReachCases.java --no-cache
      - run: configreach plan examples/combinations --fixture xunit --output /tmp/ConfigReachCases.cs --no-cache
      - run: configreach workspace . --format json --output /tmp/configreach-workspaces.json --no-cache
      - run: configreach adapters --format json --output /tmp/configreach-adapters.json
      - run: configreach reproduce examples/combinations --runs 3 --format json --output /tmp/configreach-repro.json
      - run: configreach schema --format json --output /tmp/configreach-schemas.json
      - run: configreach schema --kind report --check /tmp/configreach-report.json
      - run: configreach schema --kind plan --check /tmp/configreach-plan.json
      - run: configreach schema --kind workspace --check /tmp/configreach-workspaces.json
      - run: configreach schema --kind capabilities --check /tmp/configreach-adapters.json
      - run: configreach schema --kind reproducibility --check /tmp/configreach-repro.json
      - run: configreach doctor examples/polyglot

  confrca-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/validation/confrca-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Verify Git LFS
        run: git lfs version
      - name: Freeze ConfRCA public snapshot
        run: python validation/confrca/refresh_public_snapshot.py
      - name: Run ConfRCA benchmark
        run: python validation/confrca/run_confrca_benchmark.py
      - name: Run focused tests
        run: pytest -q tests/test_confrca_benchmark.py
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: confrca-bootstrap-evidence
          path: |
            validation/confrca/data/
            validation/results/confrca.json
            validation/results/confrca.md
          if-no-files-found: error
          retention-days: 7
