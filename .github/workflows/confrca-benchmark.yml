name: ConfRCA external benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install ConfigReach
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen ConfRCA evidence exists
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in \
            validation/confrca/data/config_version.csv \
            validation/confrca/data/confrca_labels.csv \
            validation/confrca/data/SOURCE.json; do
            if [[ ! -s "$path" ]]; then
              echo "::error file=$path::Frozen ConfRCA evidence is missing. Refresh it locally with an HF_TOKEN that can read iainzhang/confRCA, then commit the reduced snapshot before dispatching this verifier."
              missing=1
            fi
          done
          exit "$missing"
      - name: Re-run ConfRCA benchmark from frozen evidence
        run: python validation/confrca/run_confrca_benchmark.py
      - name: Run focused unit tests
        run: pytest -q tests/test_confrca_benchmark.py
      - name: Show generated benchmark summary
        run: cat validation/results/confrca.md
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confrca-external-benchmark
          path: |
            validation/confrca/data/
            validation/results/confrca.json
            validation/results/confrca.md
          if-no-files-found: error
          retention-days: 30
