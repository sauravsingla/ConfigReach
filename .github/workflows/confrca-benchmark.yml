name: ConfRCA external benchmark

on:
  push:
    branches:
      - validation/confrca-benchmark
    paths:
      - "validation/confrca/**"
      - ".github/workflows/confrca-benchmark.yml"
      - "src/configreach/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install ConfigReach and benchmark dependencies
        run: python -m pip install -e ".[dev]" pyarrow
      - name: Download and freeze public ConfRCA snapshot
        run: python validation/confrca/refresh_public_snapshot.py
      - name: Run ConfRCA external benchmark
        run: python validation/confrca/run_confrca_benchmark.py
      - name: Run focused unit tests
        run: pytest -q tests/test_confrca_benchmark.py
      - name: Show generated benchmark summary
        run: cat validation/results/confrca.md
      - name: Commit immutable benchmark snapshot and results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/confrca/data validation/results/confrca.json validation/results/confrca.md
          if git diff --cached --quiet; then
            echo "Benchmark snapshot already current"
            exit 0
          fi
          git commit -m "validation: add ConfRCA external benchmark evidence [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confrca-external-benchmark
          path: |
            validation/confrca/data/
            validation/results/confrca.json
            validation/results/confrca.md
          if-no-files-found: error
          retention-days: 30
