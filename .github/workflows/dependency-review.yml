name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Explain unavailable dependency graph
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::GitHub Dependency Review is unavailable until the repository Dependency graph is enabled. Dependabot, CodeQL, OpenSSF Scorecard and container scanning remain active."
          echo "Dependency Review will begin enforcing high-severity dependency changes automatically once GitHub's Dependency graph is enabled."
