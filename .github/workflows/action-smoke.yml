name: GitHub Action smoke test

on:
  pull_request:
    paths:
      - action.yml
      - src/**
      - pyproject.toml
      - examples/**
      - .github/workflows/action-smoke.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - src/**
      - pyproject.toml
      - examples/**
      - .github/workflows/action-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ConfigReach as a local GitHub Action
        uses: ./
        with:
          path: examples/basic
          format: json
          output: ${{ runner.temp }}/configreach-action.json
          fail-under: "0"
          fail-on: ""
      - name: Verify action output
        run: python -m json.tool "${{ runner.temp }}/configreach-action.json" >/dev/null
