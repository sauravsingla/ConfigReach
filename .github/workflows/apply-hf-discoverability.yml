name: Apply Hugging Face discoverability links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-hf-discoverability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Hugging Face discovery links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          space_badge = '[![Hugging Face Space](https://img.shields.io/badge/Hugging%20Face-Space-FFD21E?logo=huggingface&logoColor=000)](https://huggingface.co/spaces/sauravsingla08/ConfigReach)'
          dataset_badge = '[![Hugging Face Dataset](https://img.shields.io/badge/Hugging%20Face-Dataset-FFD21E?logo=huggingface&logoColor=000)](https://huggingface.co/datasets/sauravsingla08/configreach-validation)'
          if space_badge not in text:
              anchor = '[![PyPI](https://img.shields.io/pypi/v/configreach.svg)](https://pypi.org/project/configreach/)'
              if anchor not in text:
                  raise SystemExit('README PyPI badge anchor not found')
              text = text.replace(anchor, anchor + '\n' + space_badge + '\n' + dataset_badge, 1)
              readme.write_text(text, encoding='utf-8')

          page = Path('docs/index.html')
          html = page.read_text(encoding='utf-8')
          dataset_url = 'https://huggingface.co/datasets/sauravsingla08/configreach-validation'
          if dataset_url not in html:
              source_button = '<a class="btn" href="https://github.com/sauravsingla/ConfigReach" target="_blank" rel="noopener noreferrer">View source ↗</a>'
              dataset_button = '<a class="btn" href="https://huggingface.co/datasets/sauravsingla08/configreach-validation" target="_blank" rel="noopener noreferrer">Explore validation dataset ↗</a>'
              if source_button not in html:
                  raise SystemExit('docs source button anchor not found')
              html = html.replace(source_button, dataset_button + source_button, 1)

              nav_github = '<a href="https://github.com/sauravsingla/ConfigReach" target="_blank" rel="noopener noreferrer">GitHub ↗</a>'
              nav_dataset = '<a href="https://huggingface.co/datasets/sauravsingla08/configreach-validation" target="_blank" rel="noopener noreferrer">Dataset ↗</a>'
              if nav_github in html and nav_dataset not in html:
                  html = html.replace(nav_github, nav_dataset + nav_github, 1)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-hf-discoverability.yml
          git add README.md docs/index.html
          git commit -m "docs: link Hugging Face Space and validation dataset"
          git push origin HEAD:main
